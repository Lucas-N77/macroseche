<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover : l'app occupe tout l'écran (encoche comprise), les marges sont gérées en CSS -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MacroSèche</title>
  <meta name="description" content="Suivi des calories et des macros repas par repas pour réussir ta sèche. Hors ligne, sans compte, données gardées sur ton téléphone.">

  <!-- Couleur de la barre du navigateur (claire / sombre) -->
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <!-- Mode « app » sur iPhone (ajout à l'écran d'accueil) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- « default » : texte de la barre d'état lisible en thème clair comme en sombre
       (« black-translucent » afficherait un texte blanc illisible sur fond clair) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MacroSèche">
  <meta name="format-detection" content="telephone=no">

  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Icônes SVG réutilisables (<svg><use href="#i-..."></svg>) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-today" viewBox="0 0 24 24"><rect x="4.5" y="3.5" width="15" height="17" rx="3"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></symbol>
    <symbol id="i-progress" viewBox="0 0 24 24"><path d="M4 19.5h16"/><path d="M5 15.5l4-4.5 3.5 3 6.5-7.5"/></symbol>
    <symbol id="i-foods" viewBox="0 0 24 24"><path d="M12 7.6c-1.5-1.1-3.5-1.3-5-.4-2.3 1.4-2.8 4.6-1.7 7.6 1.1 3.1 3.3 5.7 5.1 5.7.7 0 1-.3 1.6-.3s.9.3 1.6.3c1.8 0 4-2.6 5.1-5.7 1.1-3 .6-6.2-1.7-7.6-1.5-.9-3.5-.7-5 .4z"/><path d="M12 7.5c0-2 1-3.4 3-4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6.5h9M18 6.5h2M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15.5" cy="6.5" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="17.5" r="2.2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></symbol>
    <symbol id="i-barcode" viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M8 8.5v7M11 8.5v7M13.5 8.5v7M16 8.5v7"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 3L5.5 13.5h6l-1 7.5 8-10.5h-6z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.1 5.6.8-4 4 .9 5.6L12 16.6l-5 2.7.9-5.6-4-4 5.6-.8z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/><path d="M10 11v5M14 11v5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="18" cy="12" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.5c3.2 4.1 6 7.3 6 10.6a6 6 0 0 1-12 0c0-3.3 2.8-6.5 6-10.6z"/></symbol>
    <symbol id="i-steps" viewBox="0 0 24 24"><circle cx="13.5" cy="4.5" r="1.7"/><path d="M12.8 7.8L11 13.2l3 3 1 4.8M11 13.2l-2.4 3.4-2.6 1M12.6 8.6L9.3 10.4 8.2 13M12.9 8.6l2.9 2.6 2.7.4"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8 10.5a5 5 0 0 1 8 0"/><path d="M12 10.5l1.6-2.2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3.5v11M8 7.5l4-4 4 4"/><path d="M8 10.5H6.5a1.5 1.5 0 0 0-1.5 1.5v7a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5H16"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3.5v11M8 10.5l4 4 4-4"/><path d="M5 19.5h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.4"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 21c-3.9 0-6.6-2.6-6.6-6.2 0-2.6 1.4-4.6 3.3-6.4.3 1.6 1.1 2.7 2.2 3.2-.3-3.6 1.3-6.5 4.1-8.6.2 2.6 1.4 4.3 2.9 6 1.2 1.4 1.9 3 1.9 5.2 0 3.9-3.3 6.8-7.8 6.8z"/></symbol>
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M3.5 10v4M6.5 7.5v9M17.5 7.5v9M20.5 10v4M6.5 12h11"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4.5 19.5h4l10-10-4-4-10 10z"/><path d="M13 7l4 4"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5.5M6.5 11L12 5.5l5.5 5.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v13.5M6.5 13l5.5 5.5 5.5-5.5"/></symbol>
    <symbol id="i-coach" viewBox="0 0 24 24"><path d="M12 3.5l2 4.5 4.5.5-3.4 3.1 1 4.6L12 13.9l-4.1 2.3 1-4.6L5.5 8.5 10 8z"/><path d="M8 20.5h8"/></symbol>
  </svg>

  <div id="app">
    <!-- Contenu de l'onglet affiché (généré par app.js) -->
    <main id="view" tabindex="-1">
      <div class="boot">
        <div class="boot-logo"><svg class="ic"><use href="#i-flame"/></svg></div>
        <p>Chargement de MacroSèche…</p>
      </div>
    </main>

    <!-- Barre d'onglets du bas -->
    <nav id="tabbar" aria-label="Navigation principale" hidden>
      <button class="tab" data-action="tab" data-tab="today" aria-label="Aujourd'hui">
        <svg class="ic"><use href="#i-today"/></svg><span>Aujourd'hui</span>
      </button>
      <button class="tab" data-action="tab" data-tab="progress" aria-label="Progrès">
        <svg class="ic"><use href="#i-progress"/></svg><span>Progrès</span>
      </button>
      <button class="tab tab-add" data-action="add-food" aria-label="Ajouter un aliment">
        <span class="tab-add-btn"><svg class="ic"><use href="#i-plus"/></svg></span>
      </button>
      <button class="tab" data-action="tab" data-tab="foods" aria-label="Aliments">
        <svg class="ic"><use href="#i-foods"/></svg><span>Aliments</span>
      </button>
      <button class="tab" data-action="tab" data-tab="settings" aria-label="Réglages">
        <svg class="ic"><use href="#i-settings"/></svg><span>Réglages</span>
      </button>
    </nav>
  </div>

  <!-- Feuilles (panneaux qui montent du bas), dialogues et notifications -->
  <div id="sheets"></div>
  <div id="dialogs"></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- Bannière de mise à jour (service worker) -->
  <div id="update-banner" class="update-banner" role="status" hidden>
    <span>Nouvelle version disponible</span>
    <button class="btn btn-small btn-primary" data-action="apply-update">Recharger</button>
  </div>

  <noscript>
    <p class="noscript">MacroSèche a besoin de JavaScript. Active-le dans Réglages &gt; Safari &gt; Avancé.</p>
  </noscript>

  <script src="./foods.js"></script>
  <script src="./app.js"></script>
</body>
</html>
